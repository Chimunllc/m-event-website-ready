<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --bg-0:#0a0c11; --bg-1:#12151e; --panel:rgba(20,24,33,.86); --line:#262c3a;
    --txt:#eceef4; --mut:#98a0b2; --dim:#6a7284;
    --accent:#ffb14d; --accent-2:#ff8f2e; --accent-soft:rgba(255,177,77,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg-0);color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  /* Loading */
  #load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg-0);z-index:20;
    transition:opacity .5s ease;gap:0}
  #load.hide{opacity:0;pointer-events:none}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid #2a3040;border-top-color:var(--accent);
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Header */
  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:16px 18px;pointer-events:none;
    background:linear-gradient(180deg, rgba(8,10,14,.72), rgba(8,10,14,0))}
  .brand{display:flex;align-items:center;gap:11px;pointer-events:auto}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#20140a;font-weight:800;font-size:17px;box-shadow:0 6px 20px -6px var(--accent-2)}
  .brand h1{font-size:14px;font-weight:700;letter-spacing:.01em}
  .brand small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
  .tag{pointer-events:auto;font-size:11px;color:var(--accent);border:1px solid var(--accent-soft);
    background:var(--accent-soft);padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.05em}

  /* Readout */
  .readout{position:fixed;left:18px;top:64px;z-index:10;font-size:12.5px;
    background:rgba(10,12,17,.6);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
    font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
  .readout b{color:var(--accent);font-weight:700}
  .readout span{color:var(--mut)}

  /* Dock */
  .dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    width:min(680px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:12px 14px;backdrop-filter:blur(14px);
    box-shadow:0 20px 50px -24px #000;display:flex;flex-direction:column;gap:11px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-weight:600;min-width:54px}
  .sizes{display:flex;gap:7px;flex-wrap:wrap}
  .chip{appearance:none;border:1px solid var(--line);background:#1b2029;color:var(--txt);
    font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .05s;font-variant-numeric:tabular-nums}
  .chip:hover{border-color:#3a4256}
  .chip:active{transform:translateY(1px)}
  .chip[aria-pressed="true"]{background:linear-gradient(150deg,var(--accent),var(--accent-2));
    color:#20140a;border-color:transparent}
  .chip .u{font-size:11px;opacity:.7;margin-left:1px}
  .tgl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt);cursor:pointer;
    border:1px solid var(--line);background:#181d27;border-radius:9px;padding:6px 11px;font-weight:500}
  .tgl input{position:absolute;opacity:0;width:0;height:0}
  .sw{width:32px;height:18px;border-radius:20px;background:#2a3040;position:relative;transition:background .18s;flex-shrink:0}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#8791a3;transition:transform .18s,background .18s}
  .tgl input:checked + .sw{background:var(--accent-soft)}
  .tgl input:checked + .sw::after{transform:translateX(14px);background:var(--accent)}
  .tgl input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
  .spacer{flex:1}
  .ghost{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);
    font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer}
  .ghost:hover{color:var(--txt);border-color:#3a4256}
  .chip:focus-visible,.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{position:fixed;left:50%;bottom:calc(16px + 96px);transform:translateX(-50%);z-index:9;
    font-size:11px;color:var(--dim);letter-spacing:.04em;pointer-events:none;opacity:.85}
  @media (max-width:560px){ .lbl{min-width:100%} .hint{display:none} }

<model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const CROSS = 0.30;           // трассын огтлол 30см
const app = document.getElementById('app');

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c11);
scene.fog = new THREE.Fog(0x0a0c11, 22, 46);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 6.4, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 6; controls.maxDistance = 44;
controls.maxPolarAngle = Math.PI*0.5 - 0.03;
controls.target.set(0, 1.8, 0);

function tentRise(){ return Math.min(2.6, state.w*0.20); }
function targetY(){
  if(state.mode==='tent') return state.h + tentRise()*0.5 + 0.3;
  return state.truss ? Math.max(2.4, state.h+1.6) : (state.h*0.6 + 0.6);
}
function frameCamera(){
  const span = Math.max(state.w, state.d, 5);
  const ty = targetY();
  controls.target.set(0, ty, 0);
  const dist = span*1.5 + 6;
  camera.position.set(dist*0.6, ty + span*0.48 + 2.2, dist*0.86);
  controls.update();
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbcd0ec, 0x20242e, 0.8); scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.28); scene.add(amb);
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(7, 13, 6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
const sc = key.shadow.camera; sc.near=1; sc.far=60; sc.left=-20; sc.right=20; sc.top=20; sc.bottom=-20;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fa6ff, 0.6); rim.position.set(-8,6,-7); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-4,5,10); scene.add(fill);
// Гэрэлтүүлэг/фон горимоор: асар = гэгээлэг (өдөр), тайз = бага бараан (тайзны уур амьсгал)
function setEnv(){
  if(state.mode==='tent'){
    scene.background.set(0x2b3345); scene.fog.color.set(0x2b3345); scene.fog.near=34; scene.fog.far=90;
    hemi.intensity=1.15; amb.intensity=0.55; key.intensity=2.7; renderer.toneMappingExposure=1.28;
    ground.material.color.set(0x3a424f);
  } else {
    scene.background.set(0x141824); scene.fog.color.set(0x141824); scene.fog.near=24; scene.fog.far=52;
    hemi.intensity=0.75; amb.intensity=0.3; key.intensity=2.4; renderer.toneMappingExposure=1.12;
    ground.material.color.set(0x1b202b);
  }
}

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color:0x14171f, roughness:0.95, metalness:0.0 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(30, 30, 0x2a3142, 0x1c2029);
grid.material.transparent = true; grid.material.opacity = 0.5; grid.position.y = 0.002; scene.add(grid);

// ---------- materials ----------
const matAlu  = new THREE.MeshStandardMaterial({ color:0xbcc0c8, metalness:0.96, roughness:0.34 });
const matDeck = new THREE.MeshStandardMaterial({ color:0x1c1f27, metalness:0.15, roughness:0.82 });
const matDeckTop = new THREE.MeshStandardMaterial({ color:0x23262f, metalness:0.1, roughness:0.7 });
const matLED  = new THREE.MeshStandardMaterial({ color:0x0a0c12, metalness:0.2, roughness:0.5,
  emissive:0x101826, emissiveIntensity:1.0 });
const matLamp = new THREE.MeshStandardMaterial({ color:0x1a1a1a, metalness:0.6, roughness:0.5 });
const matLens = new THREE.MeshStandardMaterial({ color:0xffb14d, emissive:0xff9a3c, emissiveIntensity:2.2 });
const matFabric = new THREE.MeshStandardMaterial({ color:0xf3f1ea, roughness:0.92, metalness:0.0,
  side:THREE.DoubleSide, transparent:true, opacity:0.97, emissive:0x15130f, emissiveIntensity:0.45 });
const matValance = new THREE.MeshStandardMaterial({ color:0xece9e0, roughness:0.95, side:THREE.DoubleSide });
const matCloth = new THREE.MeshStandardMaterial({ color:0xfaf8f2, roughness:0.88, metalness:0.0 });
const matChair = new THREE.MeshStandardMaterial({ color:0x9a7b46, roughness:0.5, metalness:0.35 });  // chiavari алт-бор
// 160см диаметртэй банкетын дугуй ширээ (даавуу бүрээстэй)
let _tableGeo = null;
function tableGeo(){
  if(_tableGeo) return _tableGeo;
  const R = 0.80, topH = 0.75;
  const cloth = new THREE.CylinderGeometry(R, R*1.07, topH, 28, 1, false); cloth.translate(0, topH/2, 0);
  const top = new THREE.CylinderGeometry(R*1.02, R*1.02, 0.05, 28); top.translate(0, topH, 0);
  _tableGeo = mergeGeometries([cloth, top], false);
  return _tableGeo;
}
// Урт банкет ширээ 2.4×0.8м (даавуу бүрээстэй)
let _longGeo = null;
function longTableGeo(){
  if(_longGeo) return _longGeo;
  const L=2.4, Wd=0.85, topH=0.75;
  const cloth = new THREE.BoxGeometry(L, topH, Wd); cloth.translate(0, topH/2, 0);
  const top = new THREE.BoxGeometry(L*1.02, 0.05, Wd*1.05); top.translate(0, topH, 0);
  _longGeo = mergeGeometries([cloth, top], false);
  return _longGeo;
}
// Энгийн сандал (суудал+түшлэг+4 хөл) — merged
let _chairGeo = null;
function chairGeo(){
  if(_chairGeo) return _chairGeo;
  const g=[]; const seatH=0.46, s=0.42;
  const seat=new THREE.BoxGeometry(s,0.06,s); seat.translate(0,seatH,0); g.push(seat);
  const back=new THREE.BoxGeometry(s,0.5,0.06); back.translate(0,seatH+0.28,-s/2+0.03); g.push(back);
  const legR=0.022;
  [[s/2-0.04,s/2-0.04],[s/2-0.04,-s/2+0.04],[-s/2+0.04,s/2-0.04],[-s/2+0.04,-s/2+0.04]].forEach(([x,z])=>{
    const lg=new THREE.CylinderGeometry(legR,legR,seatH,6); lg.translate(x,seatH/2,z); g.push(lg);
  });
  _chairGeo = mergeGeometries(g,false);
  return _chairGeo;
}

// ---------- truss builder (30×30, 1м-ийн зангилаатай) ----------
const _up = new THREE.Vector3(0,1,0);
function tube(p1, p2, r, seg=7){
  const dir = new THREE.Vector3().subVectors(p2,p1); const len = dir.length();
  if(len < 1e-4) return null;
  const g = new THREE.CylinderGeometry(r, r, len, seg, 1);
  const q = new THREE.Quaternion().setFromUnitVectors(_up, dir.clone().normalize());
  g.applyQuaternion(q);
  g.translate((p1.x+p2.x)/2,(p1.y+p2.y)/2,(p1.z+p2.z)/2);
  return g;
}
// Урт нь X тэнхлэгээр, төвдөө. 4 хорд + талбар бүрд зигзаг диагональ + зангилааны хөндлөвч.
function trussGeo(len){
  const h = CROSS/2, chordR = 0.019, braceR = 0.011;
  const geos = [];
  const V = (x,y,z)=>new THREE.Vector3(x,y,z);
  const corners = [[h,h],[h,-h],[-h,h],[-h,-h]];
  for(const [y,z] of corners) geos.push(tube(V(-len/2,y,z), V(len/2,y,z), chordR));
  const n = Math.max(1, Math.round(len));     // 1м сегментүүд
  const step = len/n;
  for(let i=0;i<n;i++){
    const x0 = -len/2 + i*step, x1 = x0 + step;
    // зангилааны хөндлөн хүрээ (x1 талд)
    if(i < n){
      geos.push(tube(V(x1,h,h),  V(x1,h,-h),  braceR));
      geos.push(tube(V(x1,-h,h), V(x1,-h,-h), braceR));
      geos.push(tube(V(x1,h,h),  V(x1,-h,h),  braceR));
      geos.push(tube(V(x1,h,-h), V(x1,-h,-h), braceR));
    }
    // 4 нүүр бүрд зигзаг диагональ
    const dir = (i%2===0)?1:-1;
    // top (y=h): z +h <-> -h
    geos.push(tube(V(x0,h, h*dir), V(x1,h,-h*dir), braceR));
    // bottom (y=-h)
    geos.push(tube(V(x0,-h, h*dir), V(x1,-h,-h*dir), braceR));
    // front (z=h): y +h <-> -h
    geos.push(tube(V(x0,h*dir, h), V(x1,-h*dir, h), braceR));
    // back (z=-h)
    geos.push(tube(V(x0,h*dir,-h), V(x1,-h*dir,-h), braceR));
  }
  // эхний зангилааны хүрээ
  geos.push(tube(V(-len/2,h,h),  V(-len/2,h,-h),  braceR));
  geos.push(tube(V(-len/2,-h,h), V(-len/2,-h,-h), braceR));
  geos.push(tube(V(-len/2,h,h),  V(-len/2,-h,h),  braceR));
  geos.push(tube(V(-len/2,h,-h), V(-len/2,-h,-h), braceR));
  return mergeGeometries(geos.filter(Boolean), false);
}
// кэш (ижил урттай трассыг дахин ашиглана)
const trussCache = new Map();
function trussMesh(len){
  const key = len.toFixed(2);
  let g = trussCache.get(key);
  if(!g){ g = trussGeo(len); trussCache.set(key, g); }
  const m = new THREE.Mesh(g, matAlu); m.castShadow = true; m.receiveShadow = true;
  return m;
}
// Трасс байрлуулах: axis 'x'|'y'|'z', center [x,y,z]
function placeTruss(group, len, axis, cx, cy, cz){
  const m = trussMesh(len);
  if(axis==='y') m.rotation.z = Math.PI/2;
  else if(axis==='z') m.rotation.y = Math.PI/2;
  m.position.set(cx,cy,cz); group.add(m); return m;
}
// Дурын 2 цэгийн хооронд трасс (диагональ ч болно). Урт буцаана.
function placeTrussBetween(group, p1, p2){
  const dir=new THREE.Vector3().subVectors(p2,p1); const len=dir.length(); if(len<0.05) return 0;
  const m=trussMesh(len);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), dir.clone().normalize());
  m.position.copy(p1).add(p2).multiplyScalar(0.5); group.add(m); return len;
}
// 30×30×30 холбогч шоо (12 ирмэгтэй) — зөвхөн буланд/уулзварт
let _cubeConn=null;
function cubeConnGeo(){
  if(_cubeConn) return _cubeConn;
  const h=0.15, r=0.04, V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const c=[[-h,-h,-h],[h,-h,-h],[h,-h,h],[-h,-h,h],[-h,h,-h],[h,h,-h],[h,h,h],[-h,h,h]];
  const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const g=[]; E.forEach(([a,b])=>{ const t=tube(V(...c[a]),V(...c[b]),r,6); if(t) g.push(t); });
  _cubeConn=mergeGeometries(g,false); return _cubeConn;
}
function cubeConnAt(x,y,z){ const g=cubeConnGeo().clone(); g.translate(x,y,z); return g; }

// ---------- stage assembly ----------
let stageGroup = null;
const state = { mode:'stage', w:8, d:4, h:1.0, truss:true, led:false, roof:false, walls:false, gable:true,
  tables:false, tablePos:null, tableType:'round', chairs:true, stageInTent:false,
  build:false, cells:null, buildTarget:'deck',
  trussSegs:[], trussBlocks:[], trussTip:null };
// ₮ түрээсийн үнэ (нэг арга хэмжээнд): 1×1м хавтан 25,000 · 1м каркас 25,000
const PRICE = { module:25000, trussM:25000 };
function cellsRect(W,D){ const s=new Set(); const i0=-Math.floor(W/2), j0=-Math.floor(D/2);
  for(let i=0;i<W;i++) for(let j=0;j<D;j++) s.add((i0+i)+','+(j0+j)); return s; }
function moneyFmt(n){ return (Math.round(n)||0).toLocaleString('en-US')+'₮'; }
let _tableCount = 0, _trussMeters = 0;
const _pickTruss = [];   // каркасын сегмент/блок mesh-ууд (дарж устгах)
const draggableTables = [];   // ширээ+сандлын Group-ууд (userData.ti)
// Нэг ширээний нэгж (ширээ + тойрон/хажуугийн сандал) — Group буцаана
function makeTableUnit(){
  const u = new THREE.Group();
  if(state.tableType==='long'){
    const t = new THREE.Mesh(longTableGeo(), matCloth); t.castShadow=t.receiveShadow=true; u.add(t);
    if(state.chairs){
      const perSide=3, L=2.4, gap=L/perSide;
      for(let s=-1;s<=1;s+=2) for(let i=0;i<perSide;i++){
        const c=new THREE.Mesh(chairGeo(), matChair); c.castShadow=true;
        c.position.set(-L/2+gap/2+i*gap, 0, s*0.72); c.rotation.y = s>0?Math.PI:0;
        u.add(c);
      }
    }
  } else {
    const t = new THREE.Mesh(tableGeo(), matCloth); t.castShadow=t.receiveShadow=true; u.add(t);
    if(state.chairs){
      const n=8, R=1.15;
      for(let i=0;i<n;i++){
        const a=i/n*Math.PI*2;
        const c=new THREE.Mesh(chairGeo(), matChair); c.castShadow=true;
        c.position.set(Math.cos(a)*R, 0, Math.sin(a)*R); c.rotation.y = -a + Math.PI/2;
        u.add(c);
      }
    }
  }
  return u;
}
// Ширээний автомат тор (160⌀, ~2.8м зай, ханаас 1.6м) — эхний байршил
function gridPositions(){
  const margin = 2.0, spacing = state.chairs ? 3.4 : 2.8;   // сандалтай бол илүү зай
  const innerW = state.w - 2*margin, innerD = state.d - 2*margin;
  const pos = [];
  if(innerW < 0 || innerD < 0) return pos;
  const cols = Math.floor(innerW/spacing) + 1, rows = Math.floor(innerD/spacing) + 1;
  const spanX = (cols-1)*spacing, spanZ = (rows-1)*spacing;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++)
    pos.push({ x:-spanX/2 + i*spacing, z:-spanZ/2 + j*spacing });
  return pos;
}
function clampTable(p){ const mx=state.w/2-1.0, mz=state.d/2-1.0; p.x=Math.max(-mx,Math.min(mx,p.x)); p.z=Math.max(-mz,Math.min(mz,p.z)); return p; }
const lampLights = [];

function disposeGroup(g){
  g.traverse(o=>{ if(o.isMesh){ /* geo cached — битгий dispose */ if(o.material && o.material._temp) o.material.dispose(); }});
}
function buildStage(){
  if(stageGroup){ scene.remove(stageGroup); }
  lampLights.forEach(l=>scene.remove(l)); lampLights.length = 0;
  const g = new THREE.Group();
  const W = state.w, D = state.d, H = state.h;
  const inset = 0.5, cx = W/2 - inset, cz = D/2 - inset;

  // --- тавцан (дэк) ---
  const deckThk = 0.14;
  const deck = new THREE.Mesh(new THREE.BoxGeometry(W, deckThk, D),
    [matDeck,matDeck,matDeckTop,matDeck,matDeck,matDeck]);
  deck.position.y = H - deckThk/2; deck.castShadow = true; deck.receiveShadow = true; g.add(deck);
  // хормогч (skirt)
  const skirtH = H - deckThk;
  const skirtMat = matDeck;
  const skirtF = new THREE.Mesh(new THREE.BoxGeometry(W, skirtH, 0.03), skirtMat);
  skirtF.position.set(0, skirtH/2, D/2); g.add(skirtF);
  const skirtB = skirtF.clone(); skirtB.position.z = -D/2; g.add(skirtB);
  const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.03, skirtH, D), skirtMat);
  skirtL.position.set(-W/2, skirtH/2, 0); g.add(skirtL);
  const skirtR = skirtL.clone(); skirtR.position.x = W/2; g.add(skirtR);

  // --- дэкийн доорх периметр трасс ---
  const belt = H - deckThk - CROSS/2;
  placeTruss(g, W, 'x', 0, belt,  cz);
  placeTruss(g, W, 'x', 0, belt, -cz);
  placeTruss(g, D, 'z', cx, belt, 0);
  placeTruss(g, D, 'z', -cx, belt, 0);

  // --- хөл (босоо трасс) ---
  const legH = H - deckThk;
  const legXs = [cx,-cx], legZs = [cz,-cz];
  const legPos = [];
  legXs.forEach(x=>legZs.forEach(z=>legPos.push([x,z])));
  if(W >= 10){ legPos.push([0,cz],[0,-cz]); }   // том тайзанд дунд хөл
  legPos.forEach(([x,z])=> placeTruss(g, legH, 'y', x, legH/2, z));

  // --- гэрэлтүүлгийн трасс (goal-post) ---
  if(state.truss){
    const towerH = Math.max(4.2, H + 3.2);
    const tx = W/2 - 0.35, tz = D/2 - 0.35;
    [[tx,tz],[tx,-tz],[-tx,tz],[-tx,-tz]].forEach(([x,z])=> placeTruss(g, towerH, 'y', x, towerH/2, z));
    // толгойн хүрээ
    placeTruss(g, W-0.4, 'x', 0, towerH, tz);
    placeTruss(g, W-0.4, 'x', 0, towerH, -tz);
    placeTruss(g, D-0.4, 'z', tx, towerH, 0);
    placeTruss(g, D-0.4, 'z', -tx, towerH, 0);
    // урд трасс дээр гэрлүүд
    const nL = Math.max(4, Math.round(W));
    for(let i=0;i<nL;i++){
      const x = -((W-1.2)/2) + i*((W-1.2)/(nL-1));
      const yoke = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.28,10), matLamp);
      yoke.position.set(x, towerH-0.28, tz); g.add(yoke);
      const head = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.24,14), matLamp);
      head.position.set(x, towerH-0.5, tz); head.rotation.x = 0.5; g.add(head);
      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.1,16), matLens);
      lens.position.set(x, towerH-0.6, tz+0.09); lens.rotation.x = -0.5-Math.PI; g.add(lens);
    }
    // 3 амбер цэгэн гэрэл (гялбаа)
    for(let i=0;i<3;i++){
      const pl = new THREE.PointLight(0xffa64d, 6, 12, 2);
      pl.position.set((-W/3)+(i*W/3), towerH-0.7, tz-0.5);
      scene.add(pl); lampLights.push(pl);
    }
  }

  // --- LED дэлгэц (ар тал) ---
  if(state.led){
    const towerH = state.truss ? Math.max(4.2, H+3.2) : (H+2.6);
    const ledH = Math.min(2.6, towerH - H - 0.4), ledW = W*0.62;
    const ledY = H + ledH/2 + 0.2;
    const led = new THREE.Mesh(new THREE.BoxGeometry(ledW, ledH, 0.12), matLED);
    led.position.set(0, ledY, -D/2 + 0.25); g.add(led);
    // хүрээ
    placeTruss(g, ledW+0.3, 'x', 0, ledY+ledH/2+0.15, -D/2+0.25);
    placeTruss(g, ledW+0.3, 'x', 0, ledY-ledH/2-0.15, -D/2+0.25);
  }

  // --- дээвэр (roof truss + мембран) ---
  if(state.roof && state.truss){
    const towerH = Math.max(4.2, H+3.2);
    const peak = towerH + 1.3;
    placeTruss(g, W-0.4, 'x', 0, peak, 0);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(W+0.6, 0.05, D+0.6),
      new THREE.MeshStandardMaterial({color:0x15181f, roughness:0.9, metalness:0.0, transparent:true, opacity:0.9}));
    roof.position.set(0, towerH+0.9, 0); roof.castShadow = true; g.add(roof);
    placeTruss(g, D-0.4, 'z',  (W-0.4)/2*0.0+0.0, towerH+0.4, 0); // тулгуур (энгийн)
  }

  stageGroup = g; scene.add(g);
  controls.target.y = targetY();
  updateReadout();
}

// ---------- МОДУЛЬ ТАЙЗ (1×1м хавтангаар өөрсдөө угсрах) ----------
function buildStageModular(){
  if(stageGroup) scene.remove(stageGroup);
  lampLights.forEach(l=>scene.remove(l)); lampLights.length=0;
  if(!state.cells) state.cells = cellsRect(state.w, state.d);
  const g = new THREE.Group();
  const H = state.h, thk = 0.14;
  const cells = [...state.cells].map(k=>k.split(',').map(Number));
  let minI=1e9,maxI=-1e9,minJ=1e9,maxJ=-1e9;
  cells.forEach(([i,j])=>{ minI=Math.min(minI,i);maxI=Math.max(maxI,i+1);minJ=Math.min(minJ,j);maxJ=Math.max(maxJ,j+1); });
  // дэк (модуль бүр 1×1м) — merged
  const deckG=[]; cells.forEach(([i,j])=>{ const b=new THREE.BoxGeometry(0.98,thk,0.98); b.translate(i+0.5,H-thk/2,j+0.5); deckG.push(b); });
  if(deckG.length){ const deck=new THREE.Mesh(mergeGeometries(deckG,false), matDeckTop); deck.castShadow=true; deck.receiveShadow=true; g.add(deck); }
  // хөл — булан бүрд (давхардлыг арилгаад)
  const corners=new Set(); cells.forEach(([i,j])=>{ corners.add(i+','+j);corners.add((i+1)+','+j);corners.add(i+','+(j+1));corners.add((i+1)+','+(j+1)); });
  const legG=[]; corners.forEach(c=>{ const [x,z]=c.split(',').map(Number); const b=new THREE.BoxGeometry(0.09,H-thk,0.09); b.translate(x,(H-thk)/2,z); legG.push(b); });
  if(legG.length){ const legs=new THREE.Mesh(mergeGeometries(legG,false), matAlu); legs.castShadow=true; g.add(legs); }
  // --- КАРКАС (1 метрээр өрдөг лего: сегмент + блок) ---
  _trussMeters = 0; _pickTruss.length = 0;
  const segs = state.trussSegs || [], blocks = state.trussBlocks || [];
  segs.forEach(s=>{
    let m;
    if(s.dir==='x')      m=placeTruss(g,1,'x', s.x+0.5, s.y, s.z);
    else if(s.dir==='z') m=placeTruss(g,1,'z', s.x, s.y, s.z+0.5);
    else                 m=placeTruss(g,1,'y', s.x, s.y+0.5, s.z);   // босоо
    m.userData={kind:'seg', ref:s}; _pickTruss.push(m);
    _trussMeters += 1;
  });
  blocks.forEach(b=>{
    const bm=new THREE.Mesh(cubeConnGeo(), matAlu); bm.position.set(b.x,b.y,b.z); bm.castShadow=true;
    bm.userData={kind:'block', ref:b}; g.add(bm); _pickTruss.push(bm);
  });
  // идэвхтэй цэг (tip) — дараагийн хэсэг залгах газар
  if(state.buildTarget==='truss' && state.trussTip){
    const t=state.trussTip;
    const mk=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),
      new THREE.MeshStandardMaterial({color:0xffb14d, emissive:0xff8f2e, emissiveIntensity:1.4}));
    mk.position.set(t.x,t.y,t.z); g.add(mk);
  }
  stageGroup=g; scene.add(g);
  controls.target.y = targetY();
  updateReadout();
}
function stagePrice(){
  const n = state.cells ? state.cells.size : 0;
  const deck = n*PRICE.module, truss = Math.round(_trussMeters)*PRICE.trussM;
  return { modules:n, trussM:Math.round(_trussMeters), deck, truss, total:deck+truss };
}
// Асар дотор жижиг тайз (ард талд) — дэк + хөл + намхан гэрэлтүүлгийн трасс
function addStageInTent(g, W, D){
  const sw=Math.min(W*0.75, 8), sd=Math.min(3.2, D*0.28), deckH=0.6, thk=0.12;
  const zc=-D/2 + sd/2 + 0.7;
  const deck=new THREE.Mesh(new THREE.BoxGeometry(sw, thk, sd), matDeck);
  deck.position.set(0, deckH-thk/2, zc); deck.castShadow=true; deck.receiveShadow=true; g.add(deck);
  const cx=sw/2-0.4, czf=zc+sd/2-0.4, czb=zc-sd/2+0.4;
  [[cx,czf],[cx,czb],[-cx,czf],[-cx,czb]].forEach(([x,z])=> placeTruss(g,(deckH-thk),'y',x,(deckH-thk)/2,z));
  const towerH=Math.min(3.0, state.h + 0.2);
  const tx=sw/2-0.3;
  [[tx,czb],[-tx,czb]].forEach(([x,z])=> placeTruss(g,towerH,'y',x,towerH/2,z));
  placeTruss(g, sw-0.4, 'x', 0, towerH, czb);
}
// ---------- АСАР (marquee tent) ----------
function buildTent(){
  if(stageGroup){ scene.remove(stageGroup); }
  lampLights.forEach(l=>scene.remove(l)); lampLights.length = 0;
  const g = new THREE.Group();
  const W = state.w, D = state.d, eaveH = state.h;
  const rise = tentRise(), peakH = eaveH + rise;
  const angle = Math.atan2(rise, W/2), slope = Math.hypot(W/2, rise);
  const V = (x,y,z)=>new THREE.Vector3(x,y,z);
  const poleR = 0.05, barR = 0.035;
  const bays = Math.max(1, Math.round(D/5));   // хөл хоорондын зай ≈ 5м
  const zAt = i => -D/2 + i*(D/bays);

  // --- каркас (хөл + дам нуруу + оройн нуруу + рафтер) ---
  const fg = [];
  for(let i=0;i<=bays;i++){
    const z = zAt(i);
    fg.push(tube(V(W/2,0,z),  V(W/2,eaveH,z),  poleR));
    fg.push(tube(V(-W/2,0,z), V(-W/2,eaveH,z), poleR));
    fg.push(tube(V(W/2,eaveH,z),  V(0,peakH,z), barR));
    fg.push(tube(V(-W/2,eaveH,z), V(0,peakH,z), barR));
  }
  fg.push(tube(V(W/2,eaveH,-D/2),  V(W/2,eaveH,D/2),  barR));
  fg.push(tube(V(-W/2,eaveH,-D/2), V(-W/2,eaveH,D/2), barR));
  fg.push(tube(V(0,peakH,-D/2),    V(0,peakH,D/2),    barR));
  const frame = new THREE.Mesh(mergeGeometries(fg.filter(Boolean), false), matAlu);
  frame.castShadow = true; g.add(frame);

  // --- дээврийн бүрээс (2 налуу хавтгай) ---
  function roofPlane(sign){
    const geo = new THREE.PlaneGeometry(slope, D);
    geo.rotateX(-Math.PI/2); geo.rotateZ(-sign*angle);
    const m = new THREE.Mesh(geo, matFabric);
    m.position.set(sign*W/4, (peakH+eaveH)/2, 0);
    m.castShadow = true; m.receiveShadow = true; return m;
  }
  g.add(roofPlane(1)); g.add(roofPlane(-1));

  // --- фестон (eave valance) ---
  function valance(len, axis, x, z){
    const geo = new THREE.PlaneGeometry(len, 0.4);
    const m = new THREE.Mesh(geo, matValance);
    if(axis==='z') m.rotation.y = Math.PI/2;
    m.position.set(x, eaveH-0.2, z); return m;
  }
  g.add(valance(W, 'x', 0, D/2)); g.add(valance(W, 'x', 0, -D/2));
  g.add(valance(D, 'z', W/2, 0)); g.add(valance(D, 'z', -W/2, 0));

  // --- дүнзэн үзүүр (gable) ---
  if(state.gable){
    [D/2, -D/2].forEach(function(z){
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-W/2,eaveH,z, W/2,eaveH,z, 0,peakH,z]),3));
      geo.setIndex([0,1,2]); geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, matFabric); m.castShadow=true; g.add(m);
    });
  }
  // --- хажуу хана (walls) — урд тал нээлттэй ---
  if(state.walls){
    [[W/2],[ -W/2]].forEach(function(a){
      const geo = new THREE.PlaneGeometry(D, eaveH); const m = new THREE.Mesh(geo, matFabric);
      m.rotation.y = Math.PI/2; m.position.set(a[0], eaveH/2, 0); m.castShadow=true; m.receiveShadow=true; g.add(m);
    });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(W, eaveH), matFabric);
    back.position.set(0, eaveH/2, -D/2); back.castShadow=true; g.add(back);
  }

  // --- ширээ+сандал — гараар чирж болдог нэгжүүд ---
  draggableTables.length = 0; _tableCount = 0;
  if(state.tables){
    if(!state.tablePos || !state.tablePos.length) state.tablePos = gridPositions();
    state.tablePos.forEach(clampTable);
    state.tablePos.forEach((p,i)=>{
      const u = makeTableUnit();
      u.position.set(p.x, 0, p.z); u.userData.ti = i;
      g.add(u); draggableTables.push(u);
    });
    _tableCount = state.tablePos.length;
  }
  // --- тайз (асар дотор, ард талд) ---
  if(state.stageInTent) addStageInTent(g, W, D);

  stageGroup = g; scene.add(g);
  controls.target.y = targetY();
  updateReadout();
}
function build(){ setEnv();
  if(state.mode==='tent') buildTent();
  else if(state.build) buildStageModular();
  else buildStage();
  if(typeof scheduleAR==='function') scheduleAR();
}

function updateReadout(){
  const r = document.getElementById('readout');
  let feats;
  if(state.mode==='tent'){
    feats = [state.gable?'үзүүртэй':null, state.walls?'ханатай':null, (state.tables&&_tableCount)?`${_tableCount} ширээ`:null].filter(Boolean).join(' · ');
    r.innerHTML = `<b>${state.w} × ${state.d} м</b> <span>· ${(state.w*state.d)} м² · асар${feats?' · '+feats:''}</span>`;
    const tip=document.getElementById('tableTip'); if(tip) tip.style.display = state.tables ? '' : 'none';
  } else if(state.build){
    const pr=stagePrice();
    r.innerHTML = `<b>${pr.modules} хавтан</b> <span>· ${pr.modules} м²${pr.trussM?` · ${pr.trussM}м каркас`:''} · h ${state.h}м</span>`;
    const pe=document.getElementById('price'); if(pe){ pe.style.display='';
      pe.innerHTML=`💰 <b>${moneyFmt(pr.total)}</b> <span style="font-size:10px;color:var(--dim)">${pr.modules}хавтан${pr.trussM?` + ${pr.trussM}м каркас`:''}</span>`; }
  } else {
    feats = [state.truss?'трасс':null, state.led?'LED':null, state.roof?'дээвэр':null].filter(Boolean).join(' · ');
    r.innerHTML = `<b>${state.w} × ${state.d} м</b> <span>· ${(state.w*state.d)} м² · h ${state.h}м${feats?' · '+feats:''}</span>`;
    const pe=document.getElementById('price'); if(pe) pe.style.display='none';
  }
  if(state.mode==='tent'){ const pe=document.getElementById('price'); if(pe) pe.style.display='none'; }
}

// ---------- UI ----------
const PRESETS = {
  stage: { sizes:[{w:6,d:4},{w:8,d:4},{w:10,d:6},{w:12,d:8}], heights:[0.6,1.0,1.4], hlbl:'Өндөр' },

};
const sizesEl = document.getElementById('sizes');
const heightsEl = document.getElementById('heights');
function renderSizes(){
  const arr = PRESETS[state.mode].sizes;
  sizesEl.innerHTML='';
  arr.forEach(s=>{
    const b=document.createElement('button'); b.className='chip';
    b.setAttribute('aria-pressed', (s.w===state.w&&s.d===state.d)?'true':'false');
    b.innerHTML = `${s.w}×${s.d}<span class="u"> м</span>`;

      if(state.mode==='stage' && state.build) state.cells=cellsRect(s.w,s.d);
      [...sizesEl.children].forEach(c=>c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true');
      build(); frameCamera(); };
    sizesEl.appendChild(b);
  });
}
function renderHeights(){
  const arr = PRESETS[state.mode].heights;
  document.getElementById('hlbl').textContent = PRESETS[state.mode].hlbl;
  heightsEl.innerHTML='';
  arr.forEach(h=>{
    const b=document.createElement('button'); b.className='chip';
    b.setAttribute('aria-pressed', h===state.h?'true':'false');
    b.innerHTML = `${h}<span class="u"> м</span>`;
    b.onclick=()=>{ state.h=h; [...heightsEl.children].forEach(c=>c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); build(); };
    heightsEl.appendChild(b);
  });
}
function applyMode(mode){
  state.mode = mode;
  const def = PRESETS[mode];
  state.w = def.sizes[1].w; state.d = def.sizes[1].d; state.h = def.heights[1]; state.tablePos = null;
  document.querySelectorAll('#modeSeg .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.mode===mode?'true':'false'));
  document.getElementById('stageToggles').style.display = mode==='stage' ? '' : 'none';
  document.getElementById('tentToggles').style.display  = mode==='tent'  ? '' : 'none';
  document.getElementById('tentTables').style.display   = mode==='tent'  ? '' : 'none';
  renderSizes(); renderHeights(); build(); frameCamera();
}
document.querySelectorAll('#modeSeg .chip').forEach(c=> c.onclick=()=>applyMode(c.dataset.mode));

document.getElementById('tgl-truss').onchange=e=>{ state.truss=e.target.checked; build(); };
document.getElementById('tgl-led').onchange=e=>{ state.led=e.target.checked; build(); };
document.getElementById('tgl-roof').onchange=e=>{ state.roof=e.target.checked; build(); };
document.getElementById('tgl-build').onchange=e=>{
  state.build=e.target.checked;
  if(state.build && !state.cells) state.cells=cellsRect(state.w,state.d);
  document.getElementById('clear-cells').style.display=state.build?'':'none';
  document.getElementById('buildBar').style.display=state.build?'':'none';
  ['tgl-truss','tgl-led','tgl-roof'].forEach(id=>{ const el=document.getElementById(id); const lab=el&&el.closest('.tgl'); if(lab) lab.style.display=state.build?'none':''; });
  build(); frameCamera();
};
document.getElementById('clear-cells').onclick=()=>{
  if(state.buildTarget==='truss'){ state.trussSegs=[]; state.trussBlocks=[]; state.trussTip=null; }
  else state.cells=new Set();
  build();
};
document.querySelectorAll('#buildTargetSeg .chip').forEach(c=> c.onclick=()=>{
  state.buildTarget=c.dataset.bt;
  document.querySelectorAll('#buildTargetSeg .chip').forEach(x=>x.setAttribute('aria-pressed', x===c?'true':'false'));
  document.getElementById('trussPad').style.display = state.buildTarget==='truss'?'':'none';
  document.getElementById('buildTip').textContent = state.buildTarget==='truss'
    ? 'Шалан дээр товшиж эхлэл тавь → сумаар 1м өр · 🔲 блок · хэсэг дээр дарж устгана'
    : 'Шалан дээр товшиж хавтан нэм/хас';
  build();
});
// Камерын өнцгөөс хамаарсан хэвтээ чиглэл (сум товч харагдацтай тохирно)
function _camAxes(){
  const f=new THREE.Vector3(); camera.getWorldDirection(f); f.y=0; f.normalize();
  const fAxis = Math.abs(f.x)>=Math.abs(f.z)?'x':'z';
  const fSign = Math.sign(fAxis==='x'?f.x:f.z)||1;
  const rAxis = fAxis==='x'?'z':'x';
  // баруун = f × up
  const r=new THREE.Vector3().crossVectors(f, new THREE.Vector3(0,1,0));
  const rSign = Math.sign(rAxis==='x'?r.x:r.z)||1;
  return { fAxis, fSign, rAxis, rSign };
}
function trussAdd(dc){
  if(!state.trussTip){ showTipHint(); return; }
  const t=state.trussTip; let seg, nx=t.x,ny=t.y,nz=t.z, prev={x:t.x,y:t.y,z:t.z};
  if(dc==='up'){ seg={x:t.x,y:t.y,z:t.z,dir:'y',prev}; ny=t.y+1; }
  else if(dc==='down'){ if(t.y<=0) return; seg={x:t.x,y:t.y-1,z:t.z,dir:'y',prev}; ny=t.y-1; }
  else {
    const a=_camAxes(); let ax,sign;
    if(dc==='fwd'){ ax=a.fAxis; sign=a.fSign; } else if(dc==='back'){ ax=a.fAxis; sign=-a.fSign; }
    else if(dc==='right'){ ax=a.rAxis; sign=a.rSign; } else { ax=a.rAxis; sign=-a.rSign; }
    if(ax==='x'){ seg={x:(sign>0?t.x:t.x-1),y:t.y,z:t.z,dir:'x',prev}; nx=t.x+sign; }
    else        { seg={x:t.x,y:t.y,z:(sign>0?t.z:t.z-1),dir:'z',prev}; nz=t.z+sign; }
  }
  state.trussSegs.push(seg); state.trussTip={x:nx,y:ny,z:nz}; build();
}
function showTipHint(){ const el=document.getElementById('buildTip'); if(el){ el.textContent='Эхлээд шалан дээр товшиж эхлэлийн цэг тавина уу'; el.style.color='var(--accent)'; setTimeout(()=>el.style.color='',1500); } }
document.querySelectorAll('#trussPad [data-td]').forEach(b=> b.onclick=()=>trussAdd(b.dataset.td));
document.getElementById('truss-block').onclick=()=>{ if(!state.trussTip){ showTipHint(); return; } const t=state.trussTip;
  if(!state.trussBlocks.some(x=>x.x===t.x&&x.y===t.y&&x.z===t.z)) state.trussBlocks.push({x:t.x,y:t.y,z:t.z}); build(); };
document.getElementById('truss-undo').onclick=()=>{ if(state.trussSegs.length){ const s=state.trussSegs.pop(); if(s.prev) state.trussTip=s.prev; build(); } };
document.getElementById('tgl-gable').onchange=e=>{ state.gable=e.target.checked; build(); };
document.getElementById('tgl-walls').onchange=e=>{ state.walls=e.target.checked; build(); };
document.getElementById('tgl-tables').onchange=e=>{ state.tables=e.target.checked; build(); };
document.getElementById('tgl-chairs').onchange=e=>{ state.chairs=e.target.checked; state.tablePos=null; build(); };
document.getElementById('tgl-stage').onchange=e=>{ state.stageInTent=e.target.checked; build(); };
document.querySelectorAll('#tableType .chip').forEach(c=> c.onclick=()=>{
  state.tableType=c.dataset.ttype;
  document.querySelectorAll('#tableType .chip').forEach(x=>x.setAttribute('aria-pressed', x===c?'true':'false'));
  if(!state.tables){ state.tables=true; document.getElementById('tgl-tables').checked=true; }
  build();
});
document.getElementById('add-table').onclick=()=>{
  if(state.mode!=='tent') return;
  const tgl=document.getElementById('tgl-tables'); if(!state.tables){ state.tables=true; tgl.checked=true; }
  if(!state.tablePos) state.tablePos=[];
  state.tablePos.push(clampTable({ x:0, z:0 }));
  build();
};

// ---------- ширээ гараар чирэх (raycaster) ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
let draggingTable = null;
function setNDC(e){ const r=renderer.domElement.getBoundingClientRect(); ndc.x=((e.clientX-r.left)/r.width)*2-1; ndc.y=-((e.clientY-r.top)/r.height)*2+1; }
function tableAt(e){ setNDC(e); ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(draggableTables,true); if(!h.length) return null;
  let o=h[0].object; while(o && draggableTables.indexOf(o)<0) o=o.parent; return o||null; }
renderer.domElement.addEventListener('pointerdown', e=>{
  if(state.mode!=='tent' || !state.tables) return;
  const t=tableAt(e);
  if(t){ draggingTable=t; controls.enabled=false; e.stopPropagation(); e.stopImmediatePropagation();
    try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){} }
}, true);
renderer.domElement.addEventListener('pointermove', e=>{
  if(!draggingTable) return;
  setNDC(e); ray.setFromCamera(ndc,camera);
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(dragPlane,p)){
    clampTable(p);
    draggingTable.position.x=p.x; draggingTable.position.z=p.z;
    const i=draggingTable.userData.ti; if(state.tablePos[i]){ state.tablePos[i].x=p.x; state.tablePos[i].z=p.z; }
  }
}, true);
function endDrag(){ if(draggingTable){ draggingTable=null; controls.enabled=true; } }
renderer.domElement.addEventListener('pointerup', endDrag, true);
renderer.domElement.addEventListener('pointercancel', endDrag, true);
// давхар товшилтоор ширээ устгах
renderer.domElement.addEventListener('dblclick', e=>{
  if(state.mode!=='tent' || !state.tables) return;
  const t=tableAt(e);
  if(t){ const i=t.userData.ti; state.tablePos.splice(i,1); build(); }
});
// ---------- модуль тайз: шалан дээр товшиж 1×1м хавтан нэм/хас ----------
let _tapX=0,_tapY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ _tapX=e.clientX; _tapY=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(state.mode!=='stage' || !state.build) return;
  if(Math.abs(e.clientX-_tapX)>6 || Math.abs(e.clientY-_tapY)>6) return;   // чирсэн = эргэлт
  setNDC(e); ray.setFromCamera(ndc,camera);
  const tapPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -state.h);
  const p=new THREE.Vector3();
  if(!ray.ray.intersectPlane(tapPlane,p)) return;
  if(state.buildTarget==='truss'){
    // 1) одоо байгаа каркас/блок дээр дарсан бол — ТУХАЙН нэгийг устгана
    const hit=ray.intersectObjects(_pickTruss,false);
    if(hit.length){ const o=hit[0].object, ref=o.userData.ref;
      const arr = o.userData.kind==='seg' ? state.trussSegs : state.trussBlocks;
      const idx = arr.indexOf(ref); if(idx>=0) arr.splice(idx,1);
      build(); return;
    }
    // 2) эс бол шалан дээр эхлэлийн цэг (tip) тавина
    const x=Math.round(p.x), z=Math.round(p.z);
    if(Math.abs(x)>25||Math.abs(z)>25) return;
    state.trussTip={x, y:0, z};
    if(!state.trussBlocks.some(b=>b.x===x&&b.y===0&&b.z===z)) state.trussBlocks.push({x,y:0,z});  // суурь блок
    build();
  } else {                                                // хавтан = тайзны дэк нүд
    const i=Math.floor(p.x), j=Math.floor(p.z);
    if(Math.abs(i)>25||Math.abs(j)>25) return;
    const k=i+','+j;
    if(!state.cells) state.cells=new Set();
    if(state.cells.has(k)) state.cells.delete(k); else state.cells.add(k);
    build();
  }
});
let spin=false;
document.getElementById('tgl-spin').onchange=e=>{ spin=e.target.checked; };
document.getElementById('reset').onclick=()=> frameCamera();

// ---------- AR (model-viewer: Android Scene Viewer + iOS Quick Look) ----------
const mv = document.getElementById('mv');
let arURL=null, _arT=null;
function updateARModel(){
  if(!stageGroup) return;
  try{
    new GLTFExporter().parse(stageGroup, glb=>{
      if(arURL) URL.revokeObjectURL(arURL);
      arURL = URL.createObjectURL(new Blob([glb],{type:'model/gltf-binary'}));
      mv.setAttribute('src', arURL);
    }, ()=>{}, { binary:true });
  }catch(e){}
}
function scheduleAR(){ clearTimeout(_arT); _arT=setTimeout(updateARModel, 450); }
document.getElementById('ar-btn').onclick=()=>{
  if(mv && mv.canActivateAR){ mv.activateAR(); }
  else { alert('AR-г гар утсан дээрээ (Android эсвэл iPhone) нээж ашиглана уу. Компьютер дээр AR боломжгүй.'); }
};
renderSizes(); renderHeights();

// ---------- loop ----------
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  if(spin && !reduce){ const o=controls.target; camera.position.x; controls.autoRotate=true; controls.autoRotateSpeed=0.9; }
  else controls.autoRotate=false;
  // амбер гэрлийн бага зэрэг анивчих
  const t=performance.now()*0.001;
  lampLights.forEach((l,i)=> l.intensity = 5.2 + Math.sin(t*2+i)*0.7);
  controls.update();
  renderer.render(scene,camera);
}
try { build(); frameCamera(); animate(); }
catch(err){ console.error('STAGE3D INIT ERROR:', err); }
function hideLoader(){ const l=document.getElementById('load'); if(l) l.classList.add('hide'); }
requestAnimationFrame(hideLoader);
setTimeout(hideLoader, 1200);   // найдвартай нуулт
</script>
