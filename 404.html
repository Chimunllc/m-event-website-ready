<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Хуудас олдсонгүй — M-Event</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://mevent.mn/" />
<style>
  :root {
    --bg:#FBFAF7; --panel:#fff; --text:#17171B; --muted:#5C5C63;
    --primary:#0B1F3A; --accent:#E95400; --border-strong:#DDD9CF; --foot-muted:#A9B7C7;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); padding:32px 20px 56px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; }
  .brand { font-family:"Manrope",sans-serif; font-weight:800; font-size:17px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--primary); text-decoration:none; display:inline-block; margin-bottom:28px; }
  h1 { font-family:"Manrope",sans-serif; font-size:23px; font-weight:800; color:var(--primary);
    letter-spacing:-.02em; margin-bottom:8px; }
  p.lede { color:var(--muted); font-size:15px; margin-bottom:24px; }
  .searchbox { display:flex; gap:8px; margin-bottom:28px; }
  .searchbox input { flex:1; min-width:0; padding:13px 16px; font-size:16px; border:1px solid var(--border-strong);
    border-radius:11px; background:var(--panel); color:var(--text); font-family:inherit; }
  .searchbox input:focus { outline:none; border-color:var(--primary); }
  .searchbox button { padding:13px 20px; border:none; border-radius:11px; background:var(--accent); color:#fff;
    font-family:"Manrope",sans-serif; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
  h2 { font-family:"Manrope",sans-serif; font-size:12px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .cats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
  .cats a { padding:9px 15px; border:1px solid var(--border-strong); border-radius:100px; background:var(--panel);
    color:var(--primary); text-decoration:none; font-size:14px; font-weight:600; }
  .cats a:hover { border-color:var(--accent); color:var(--accent); }
  .call { background:var(--primary); color:#fff; border-radius:14px; padding:22px; text-align:center; }
  .call .t { font-family:"Manrope",sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .call p { color:var(--foot-muted); font-size:13.5px; margin-bottom:14px; }
  .call a { display:inline-block; background:#fff; color:var(--primary); padding:12px 24px; border-radius:10px;
    font-family:"Manrope",sans-serif; font-weight:700; font-size:15px; text-decoration:none; letter-spacing:.02em; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">M·Event</a>
  <h1>Хайж буй хуудас олдсонгүй</h1>
  <p class="lede" id="lede">Сайт шинэчлэгдсэн тул хаяг өөрчлөгдсөн байж магадгүй. Доорхоос хайгаарай.</p>

  <form class="searchbox" action="/" method="get">
    <input type="text" name="q" id="q" placeholder="Бараа хайх — сандал, ширээ, асар…" aria-label="Бараа хайх">
    <button type="submit">Хайх</button>
  </form>

  <h2>Ангилал</h2>
  <div class="cats">
    <a href="/?cat=%D0%90%D1%81%D0%B0%D1%80">Асар</a>
    <a href="/?cat=%D0%A1%D0%B0%D0%BD%D0%B4%D0%B0%D0%BB">Сандал</a>
    <a href="/?cat=%D0%A8%D0%B8%D1%80%D1%8D%D1%8D">Ширээ</a>
    <a href="/?cat=%D0%93%D1%8D%D1%80%D1%8D%D0%BB%D1%82%D2%AF%D2%AF%D0%BB%D1%8D%D0%B3">Гэрэлтүүлэг</a>
    <a href="/?cat=%D0%A2%D0%B0%D0%B9%D0%B7">Тайз</a>
    <a href="/">Бүх бараа</a>
  </div>

  <div class="call">
    <div class="t">Олдохгүй байна уу?</div>
    <p>Утсаар шууд захиалаарай — бид тухайн өдөрт боломжтойг шалгана.</p>
    <a href="tel:+97677551010">+976 7755-1010</a>
  </div>
</div>

<script>
/* GitHub Pages нь байхгүй БҮХ зам дээр энэ хуудсыг өгдөг.
   Google-д Booqable үеийн хуучин хаягууд индекслэгдсэн хэвээр байна:
     /products/1500w · /products/13 · /products/3-5 · /products/<uuid> · /collections/<uuid>
   Өмнө нь slug-ийг шууд `?q=` болгож шиддэг байсан тул зочин ХООСОН хайлтын
   дэлгэц дээр буудаг байв (хэмжсэн: 9 хаягийн 6 нь 0 илэрц). Одоо:
     1) утгагүй хэсгийг (uuid, hex) хаяна
     2) урт→богино нэр дэвшигч үүсгэж каталогтой тулгана
     3) ЯГ нэг бараа таарвал шууд тэр хуудас руу
     4) олон таарвал хайлт руу, огт таарахгүй бол ЭНЭ хуудсан дээр үлдэнэ
   ⚠ `searchKey` нь index.html-тэй ЯГ ИЖИЛ байх ёстой — тест барина. */
(function () {
  var MN_LAT = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z',
    'и':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','ө':'o','п':'p','р':'r','с':'s',
    'т':'t','у':'u','ү':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'y',
    'ь':'','э':'e','ю':'yu','я':'ya' };
  function searchKey(str) {
    let t = '';
    for (const ch of String(str || '').toLowerCase()) t += (MN_LAT[ch] !== undefined ? MN_LAT[ch] : ch);
    return t.replace(/kh/g, 'h').replace(/ts/g, 'c').replace(/y/g, 'i').replace(/u/g, 'o')
            .replace(/[^a-z0-9]+/g, '').replace(/(.)\1+/g, '$1');
  }

  var UUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
  var JUNK = /^[0-9a-f]{8,}$/;                      // үлдсэн урт hex — утга агуулахгүй
  var UNITS = { 'w': 'вт', 'kw': 'квт', 'v': 'в', 'm': 'м', 'l': 'л' };

  function slugWords(slug) {
    return String(slug || '').toLowerCase().replace(/\.html?$/, '')
      .replace(UUID, ' ')                           // «300-<uuid>» → «300», дан uuid → хоосон
      .split(/[-_+.\s]+/)
      .filter(function (w) { return w && !JUNK.test(w); });
  }
  // Нэр дэвшигч: нэгжийг кирилл болгосон хувилбар → бүтэн → сүүлээс тайрсан → ганц үг
  function candidates(words) {
    var out = [], i;
    var uni = words.map(function (w) {
      var m = w.match(/^(\d+)([a-z]{1,3})$/);
      return (m && UNITS[m[2]]) ? m[1] + UNITS[m[2]] : w;
    });
    if (uni.join(' ') !== words.join(' ')) out.push(uni.join(' '));
    for (i = words.length; i >= 1; i--) out.push(words.slice(0, i).join(' '));
    for (i = 0; i < words.length; i++) if (!/^\d+$/.test(words[i])) out.push(words[i]);
    var seen = {}, uniq = [];
    out.forEach(function (c) { if (c && !seen[c]) { seen[c] = 1; uniq.push(c); } });
    return uniq;
  }

  var path = '';
  try { path = decodeURIComponent(location.pathname || ''); } catch (e) { path = location.pathname || ''; }
  var m = path.match(/\/(?:products?|collections?)\/([^\/?#]+)/i);
  var words = m ? slugWords(m[1]) : [];
  if (!words.length) return;                        // танихгүй зам → энэ хуудсан дээр үлдэнэ

  var phrase = words.join(' ');
  var q = document.getElementById('q');
  if (q) q.value = phrase;
  var lede = document.getElementById('lede');
  if (lede) lede.textContent = '«' + phrase + '» гэсэн барааг хайж байна…';

  fetch('/products.json', { cache: 'force-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (all) {
      if (!all || !all.length) throw 0;
      var keys = all.filter(function (p) {
        if (p.archived) return false;
        var n = (p.qty_mevent != null) ? Number(p.qty_mevent) : Number(p.stock);
        return (Number(n) || 0) > 0 && Number(p.price) > 0;
      }).map(function (p) {
        return { p: p, k: searchKey((p.name || '') + ' ' + (p.category || '') + ' ' + (p.code || '')) };
      });
      var cands = candidates(words);
      for (var i = 0; i < cands.length; i++) {
        var qk = searchKey(cands[i]);
        if (qk.length < 3) continue;
        var hit = keys.filter(function (x) { return x.k.indexOf(qk) !== -1; });
        if (hit.length === 1 && hit[0].p.sku) {     // ганц бараа → шууд тэр хуудас руу
          location.replace('/products/' + String(hit[0].p.sku).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '/');
          return;
        }
        if (hit.length > 1) { location.replace('/?q=' + encodeURIComponent(cands[i])); return; }
      }
      throw 0;                                      // юу ч таараагүй
    })
    .catch(function () {
      // Каталог татагдаагүй эсвэл илэрц алга — зочныг ХООСОН хайлт руу бүү шид.
      if (lede) lede.textContent = 'Энэ хаягийн бараа олдсонгүй. Доорхоос хайх эсвэл ангиллаас сонгоно уу.';
    });
})();
</script>
</body>
</html>
